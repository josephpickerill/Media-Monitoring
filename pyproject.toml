[project]
name = "briefing-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["anthropic", "pydantic>=2"]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/briefing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
